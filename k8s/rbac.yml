apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-manager
  namespace: management-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "serviceaccounts"]
    verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-manager
subjects:
  - kind: ServiceAccount
    name: k8s-manager
    namespace: management-app
