<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kubebit Player - Team</title>
  <link rel="stylesheet" href="/static/users/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <polygon points="14,2 25,8 25,20 14,26 3,20 3,8" fill="none" stroke="#3b5bdb" stroke-width="1.5"/>
          <polygon points="14,7 21,11 21,17 14,21 7,17 7,11" fill="#3b5bdb"/>
        </svg>
        <div class="brand-name">kube<span>bit</span></div>
      </div>

      <nav class="nav">
        <button class="" onclick="window.location.href='/player/tasks'">Tasks</button>
        <button class="" onclick="window.location.href='/player/profile'">Profile</button>
        <button class="active" onclick="window.location.href='/player/team'">Team</button>
      </nav>

      <div class="side-note">
        Start a container challenge from the task window, submit the flag, then review your solves and team standing.
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Team</h1>
          <p class="subtitle">Your team members, captain status, and points.</p>
        </div>
        <div class="top-actions">
          <div class="user-chip" id="userChip">Signed in</div>
          <button class="secondary" id="signOutButton" type="button">Sign out</button>
          <div class="status-pill">LIVE BOARD</div>
        </div>
      </div>

      <section class="page active" id="teamPage">
        <div class="panel-grid">
          <div class="panel">
            <div class="panel-title">Team</div>
            <div class="stat-list" id="teamStats">
              <div class="stat-row"><span>Status</span><strong>Loading</strong></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">Members</div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Captain</th><th>Points</th></tr></thead>
                <tbody id="teamMembersTable"><tr><td colspan="5" class="empty">Loading team...</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  
  <script src="/static/users/app.js"></script>
</body>
</html>
