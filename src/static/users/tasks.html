<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kubebit Player - Tasks</title>
  <link rel="stylesheet" href="/static/users/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <polygon points="14,2 25,8 25,20 14,26 3,20 3,8" fill="none" stroke="#3b5bdb" stroke-width="1.5"/>
          <polygon points="14,7 21,11 21,17 14,21 7,17 7,11" fill="#3b5bdb"/>
        </svg>
        <div class="brand-name">kube<span>bit</span></div>
      </div>

      <nav class="nav">
        <button class="active" onclick="window.location.href='/player/tasks'">Tasks</button>
        <button class="" onclick="window.location.href='/player/profile'">Profile</button>
        <button class="" onclick="window.location.href='/player/team'">Team</button>
      </nav>

      <div class="side-note">
        Start a container challenge from the task window, submit the flag, then review your solves and team standing.
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Tasks</h1>
          <p class="subtitle">Available CTF challenges for your team.</p>
        </div>
        <div class="top-actions">
          <div class="user-chip" id="userChip">Signed in</div>
          <button class="secondary" id="signOutButton" type="button">Sign out</button>
          <div class="status-pill">LIVE BOARD</div>
        </div>
      </div>

      <section class="page active" id="tasksPage">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search tasks..." />
          <div class="filters" id="filters"></div>
        </div>

        <div class="progress">
          <span class="progress-label">Your progress</span>
          <div class="track"><div class="fill" id="progressFill"></div></div>
          <span class="progress-count" id="progressCount">0 / 0 solved</span>
        </div>

        <div class="grid" id="challengeGrid">
          <div class="empty">Loading tasks...</div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="challengeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog">
      <div class="dialog-head">
        <div>
          <div class="dialog-meta" id="modalMeta"></div>
          <h2 class="dialog-title" id="modalTitle"></h2>
        </div>
        <button class="icon-button" id="closeModal" type="button" aria-label="Close">x</button>
      </div>

      <div class="dialog-body">
        <p class="description" id="modalDescription"></p>
        <div class="challenge-url" id="challengeUrl"></div>

        <div class="actions">
          <button class="primary" id="startStopButton" type="button">Start</button>
          <div class="status" id="runtimeStatus"></div>
        </div>

        <form id="flagForm">
          <div class="form-row">
            <div>
              <label for="flagInput">Flag</label>
              <input id="flagInput" class="mono" name="flag" type="text" placeholder="kubebit{...}" autocomplete="off" required />
            </div>
            <button class="primary" type="submit">Submit flag</button>
          </div>
          <div class="status" id="flagStatus"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="/static/users/app.js"></script>
</body>
</html>
